name: Core Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: PHP syntax check
        run: find . -type f -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

  code-style:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Regenerate autoloader
        run: composer dump-autoload
      - name: PHP_CodeSniffer (PSR-12)
        continue-on-error: true
        run: vendor/bin/phpcs --standard=PSR12 --ignore=vendor .

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Regenerate autoloader
        run: composer dump-autoload
      - name: PHPStan Level Max
        run: php -d memory_limit=512M vendor/bin/phpstan analyse --level=max --no-progress

  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Regenerate autoloader
        run: composer dump-autoload
      - name: Prepare env
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.testing ]; then
              cp .env.testing .env
            elif [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "ERROR: No .env template found!"
              exit 1
            fi
          fi
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=:memory:|g' .env
          sed -i 's|CACHE_DRIVER=.*|CACHE_DRIVER=file|g' .env
      - name: PHPUnit tests
        run: php vendor/bin/phpunit --no-progress

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: pdo, json, mbstring
          coverage: xdebug
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Infection Mutation Testing (min MSI 80%)
        run: php -d zend_extension=xdebug vendor/bin/infection --min-msi=80 --threads=4 --no-progress

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: pdo, json, mbstring
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run benchmarks
        run: php benchmark.php

  technical-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Regenerate autoloader
        run: composer dump-autoload
      - name: Run release technical gate
        run: composer release:check
