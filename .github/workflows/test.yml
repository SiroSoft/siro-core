name: Core Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# ──────────────────────────────────────────────────────────────
# CI Architecture Decision (v1.0 — Phase A1)
#
# Compatibility Matrix (runs ×9):
#   3 OS × 3 PHP → install, bootstrap, PHPUnit
#   Purpose: prove runtime/test compatibility across platforms.
#
# Quality Gate (runs ×1):
#   Ubuntu + PHP 8.2 only
#   Purpose: expensive static analysis, security, mutation, fuzz.
#   These checks are platform-independent — running them ×9 wastes CI
#   minutes without catching cross-platform bugs.
#
# See ROADMAP_V1.md § A1 for full rationale.
# ──────────────────────────────────────────────────────────────

jobs:
  # ════════════════════════════════════════════════════════════
  # COMPATIBILITY MATRIX — 3 OS × 3 PHP
  # ════════════════════════════════════════════════════════════

  phpunit:
    name: "PHPUnit — ${{ matrix.os }} / PHP ${{ matrix.php }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ['8.2', '8.3', '8.4']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: pdo, pdo_sqlite, sqlite3, json, mbstring, openssl, fileinfo, curl, pdo_mysql
          coverage: none
      - name: Validate composer.json
        run: composer validate --no-check-all --no-check-publish
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare env
        shell: bash
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.testing ]; then
              cp .env.testing .env
            elif [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "ERROR: No .env template found!"
              exit 1
            fi
          fi
      - name: Run PHPUnit (Unit + Integration)
        shell: bash
        run: |
          PROGRESS="/tmp/phpunit-progress.txt"
          START=$(date +%s)
          # Launch progress monitor in background
          chmod +x tests/ci-progress-monitor.sh
          CI_PROGRESS_FILE="$PROGRESS" bash tests/ci-progress-monitor.sh phpunit-output.txt &
          MPID=$!
          # Run PHPUnit
          # Run PHPUnit in background so we can enforce an internal timeout
          php vendor/bin/phpunit \
            --configuration=phpunit-ci.xml \
            --testsuite=Unit,Integration \
            --no-progress --testdox \
            --log-junit=results.xml \
            --log-events-text=/tmp/phpunit-events.txt \
            < /dev/null \
            >phpunit-output.txt 2>&1 &
          PU_PID=$!
          # Poll: if PHPUnit is still alive after 20 min, kill it (hang detection)
          ALIVE=1
          for i in $(seq 1 120); do
            sleep 10
            if ! kill -0 $PU_PID 2>/dev/null; then ALIVE=0; break; fi
          done
          if [ $ALIVE -eq 1 ]; then
            echo "=== INTERNAL TIMEOUT: PHPUnit hung >20min, killing PID $PU_PID ===" >> phpunit-output.txt
            kill $PU_PID 2>/dev/null
            sleep 10
            if kill -0 $PU_PID 2>/dev/null; then
              echo "=== SIGTERM ignored, sending SIGKILL ===" >> phpunit-output.txt
              kill -9 $PU_PID 2>/dev/null
            fi
          fi
          # Kill orphaned child processes (php -S dev servers etc.) that hold the log pipe
          CHILDREN=$(pgrep -P $PU_PID 2>/dev/null || true)
          if [ -n "$CHILDREN" ]; then
            echo "=== Killing orphaned children: $CHILDREN ===" >> phpunit-output.txt
            for c in $CHILDREN; do kill -9 $c 2>/dev/null || true; done
          fi
          wait $PU_PID; CODE=$?
          kill $MPID 2>/dev/null 2>&1
          END=$(date +%s)
          echo "PHPUnit duration: $((END - START))s exit=$CODE" >> phpunit-output.txt
          cat phpunit-output.txt
          echo '## Test Progress' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat "$PROGRESS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $CODE
      - name: Show test failures
        if: failure()
        shell: bash
        run: |
          echo '## Test Failures' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -80 phpunit-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '## Last 15 events (hanging test = last Test\ Started)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep 'Started' /tmp/phpunit-events.txt 2>/dev/null | tail -15 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '## Full Progress Log' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/phpunit-progress.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-output-${{ matrix.os }}-${{ matrix.php }}
          path: |
            phpunit-output.txt
            /tmp/phpunit-progress.txt
            /tmp/phpunit-events.txt
            results.xml
          retention-days: 7

  fuzz-dast:
    name: "Fuzz+DAST — ubuntu / PHP 8.4"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo, pdo_sqlite, sqlite3, json, mbstring, openssl, fileinfo, curl, pdo_mysql
          coverage: none
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php8.4-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare env
        shell: bash
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.testing ]; then
              cp .env.testing .env
            elif [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "ERROR: No .env template found!"
              exit 1
            fi
          fi
      - name: Run Fuzz + DAST tests
        run: php vendor/bin/phpunit --testsuite=Fuzz,DAST --no-progress

  lint:
    name: "Lint — ${{ matrix.os }} / PHP ${{ matrix.php }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ['8.2', '8.4']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: pdo, pdo_sqlite, sqlite3, json, mbstring, openssl, fileinfo, curl
      - name: PHP syntax check
        shell: bash
        run: |
          find . -type f -name "*.php" -not -path "./vendor/*" -not -path "./coverage/*" -print0 | xargs -0 -n1 php -l

  static-analysis:
    name: "PHPStan — ${{ matrix.os }} / PHP ${{ matrix.php }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ['8.2', '8.4']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: pdo, pdo_sqlite, sqlite3, json, mbstring, openssl, fileinfo, curl, pdo_mysql
          coverage: none
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPStan Level Max
        run: php -d memory_limit=512M vendor/bin/phpstan analyse --level=max --no-progress

  # ════════════════════════════════════════════════════════════
  # QUALITY GATES — Ubuntu + PHP 8.2 only
  # ════════════════════════════════════════════════════════════

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: pdo, pdo_sqlite, sqlite3, json, mbstring, openssl, fileinfo, curl
          coverage: xdebug
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare env
        shell: bash
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.testing ]; then
              cp .env.testing .env
            elif [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "ERROR: No .env template found!"
              exit 1
            fi
          fi
      - name: PHPUnit coverage (Unit suite)
        run: php -d memory_limit=2048M vendor/bin/phpunit --testsuite=Unit --coverage-text --coverage-clover=coverage/clover.xml --no-progress
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/clover.xml
            coverage/text.txt

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: pdo, pdo_sqlite, sqlite3, json, mbstring, openssl, fileinfo, curl, redis
          coverage: xdebug
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare env
        shell: bash
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.testing ]; then
              cp .env.testing .env
            elif [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "ERROR: No .env template found!"
              exit 1
            fi
          fi
      - name: Infection Mutation Testing (min MSI 80%)
        shell: bash
        run: |
          set +e
          {
            echo "PHP: $(php -v 2>&1 | head -1)"
            echo "xdebug: $(php -d zend_extension=xdebug -r 'echo extension_loaded("xdebug") ? "loaded" : "NOT loaded";' 2>&1)"
            echo "infection bin: $(ls -la vendor/bin/infection 2>&1 | head -2)"
            php -d memory_limit=512M -d zend_extension=xdebug vendor/bin/infection --min-msi=80 --threads=4 --no-progress 2>&1
          } | tee mutation-output.txt
          CODE=${PIPESTATUS[0]}
          # Emit annotations readable via checks API
          tail -25 mutation-output.txt | sed 's/::/__/g' | head -25 | while IFS= read -r l; do
            [ -n "$l" ] && echo "::error::${l:0:300}"
          done
          echo "mutation_exit_code=$CODE"
          exit $CODE

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: pdo, pdo_sqlite, sqlite3, json, mbstring, openssl, fileinfo, curl
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run benchmarks
        run: php benchmark.php

  technical-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: pdo, pdo_sqlite, sqlite3, json, mbstring, openssl, fileinfo, curl
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run release technical gate
        run: composer release:check
