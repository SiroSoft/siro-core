name: Core Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# ──────────────────────────────────────────────────────────────
# CI Architecture Decision (v1.0 — Phase A1)
#
# Compatibility Matrix (runs ×9):
#   3 OS × 3 PHP → install, bootstrap, PHPUnit
#   Purpose: prove runtime/test compatibility across platforms.
#
# Quality Gate (runs ×1):
#   Ubuntu + PHP 8.2 only
#   Purpose: expensive static analysis, security, mutation, fuzz.
#   These checks are platform-independent — running them ×9 wastes CI
#   minutes without catching cross-platform bugs.
#
# See ROADMAP_V1.md § A1 for full rationale.
# ──────────────────────────────────────────────────────────────

jobs:
  # ════════════════════════════════════════════════════════════
  # COMPATIBILITY MATRIX — 3 OS × 3 PHP
  # ════════════════════════════════════════════════════════════

  phpunit:
    name: "PHPUnit — ${{ matrix.os }} / PHP ${{ matrix.php }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ['8.2', '8.3', '8.4']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: pdo, pdo_sqlite, sqlite3, json, mbstring, openssl, fileinfo, curl, pdo_mysql
          coverage: none
      - name: Validate composer.json
        run: composer validate --no-check-all --no-check-publish
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare env
        shell: bash
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.testing ]; then
              cp .env.testing .env
            elif [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "ERROR: No .env template found!"
              exit 1
            fi
          fi
      - name: Run PHPUnit (Unit + Integration)
        shell: bash
        run: |
          START=$(date +%s)
          php vendor/bin/phpunit --testsuite=Unit,Integration --no-progress --testdox < /dev/null >phpunit-output.txt 2>&1; CODE=$?
          END=$(date +%s)
          echo "PHPUnit duration: $((END - START))s exit=$CODE" >> phpunit-output.txt
          cat phpunit-output.txt
          exit $CODE
      - name: Show test failures
        if: failure()
        shell: bash
        run: |
          echo '## Test Failures' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -80 phpunit-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-output-${{ matrix.os }}-${{ matrix.php }}
          path: phpunit-output.txt
          retention-days: 7

  fuzz-dast:
    name: "Fuzz+DAST — ubuntu / PHP 8.4"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo, pdo_sqlite, sqlite3, json, mbstring, openssl, fileinfo, curl, pdo_mysql
          coverage: none
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php8.4-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare env
        shell: bash
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.testing ]; then
              cp .env.testing .env
            elif [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "ERROR: No .env template found!"
              exit 1
            fi
          fi
      - name: Run Fuzz + DAST tests
        run: php vendor/bin/phpunit --testsuite=Fuzz,DAST --no-progress

  lint:
    name: "Lint — ${{ matrix.os }} / PHP ${{ matrix.php }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ['8.2', '8.4']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: pdo, pdo_sqlite, sqlite3, json, mbstring, openssl, fileinfo, curl
      - name: PHP syntax check
        shell: bash
        run: |
          find . -type f -name "*.php" -not -path "./vendor/*" -not -path "./coverage/*" -print0 | xargs -0 -n1 php -l

  static-analysis:
    name: "PHPStan — ${{ matrix.os }} / PHP ${{ matrix.php }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ['8.2', '8.4']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: pdo, pdo_sqlite, sqlite3, json, mbstring, openssl, fileinfo, curl, pdo_mysql
          coverage: none
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPStan Level Max
        run: php -d memory_limit=512M vendor/bin/phpstan analyse --level=max --no-progress

  # ════════════════════════════════════════════════════════════
  # QUALITY GATES — Ubuntu + PHP 8.2 only
  # ════════════════════════════════════════════════════════════

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: pdo, pdo_sqlite, sqlite3, json, mbstring, openssl, fileinfo, curl
          coverage: xdebug
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare env
        shell: bash
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.testing ]; then
              cp .env.testing .env
            elif [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "ERROR: No .env template found!"
              exit 1
            fi
          fi
      - name: PHPUnit coverage (Unit suite)
        run: php -d memory_limit=2048M vendor/bin/phpunit --testsuite=Unit --coverage-text --coverage-clover=coverage/clover.xml --no-progress
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/clover.xml
            coverage/text.txt

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: pdo, pdo_sqlite, sqlite3, json, mbstring, openssl, fileinfo, curl
          coverage: xdebug
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare env
        shell: bash
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.testing ]; then
              cp .env.testing .env
            elif [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "ERROR: No .env template found!"
              exit 1
            fi
          fi
      - name: Infection Mutation Testing (min MSI 80%)
        run: php -d memory_limit=512M -d zend_extension=xdebug vendor/bin/infection --min-msi=80 --threads=4 --no-progress

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: pdo, pdo_sqlite, sqlite3, json, mbstring, openssl, fileinfo, curl
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run benchmarks
        run: php benchmark.php

  technical-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: pdo, pdo_sqlite, sqlite3, json, mbstring, openssl, fileinfo, curl
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run release technical gate
        run: composer release:check
