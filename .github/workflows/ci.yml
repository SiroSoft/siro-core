name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, json, mbstring, openssl, fileinfo
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist
      - name: Composer Audit
        run: composer audit --format=table || echo "::warning::Composer audit found vulnerabilities"
      - name: Generate SBOM
        run: php scripts/generate-sbom.php
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: storage/sbom/
      - name: Supply Chain Audit
        run: php scripts/audit-supply-chain.php
      - name: PHPStan (Level Max)
        run: php -d memory_limit=512M vendor/bin/phpstan analyse --level=max --no-progress --memory-limit=512M

      - name: Psalm Taint Analysis
        run: php -d memory_limit=512M vendor/bin/psalm --taint-analysis --no-progress --show-info=false --php-version=8.2 2>&1 || echo "::warning::Psalm taint analysis found issues"

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, json, mbstring, openssl, fileinfo
          tools: composer:v2
          coverage: xdebug
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist
      - name: Run tests with coverage
        run: php -d zend_extension=xdebug vendor/bin/phpunit
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
      - name: Coverage Gate (≥ 80%)
        run: |
          if [ ! -f coverage/text.txt ]; then echo "::error::Coverage report not found"; exit 1; fi
          COVERAGE=$(grep -oP 'Lines:\s+\K[0-9.]+(?=%)' coverage/text.txt || echo "0")
          echo "Coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 80" | bc -l 2>/dev/null)" = "1" ] 2>/dev/null; then
            echo "::error::Coverage ${COVERAGE}% is below 80% threshold"
            exit 1
          fi

  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run fuzz tests
        run: php scripts/fuzz.php

  chaos:
    name: Chaos Engineering
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run chaos tests
        run: php scripts/chaos-test.php

  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: SAST Linter
        run: php scripts/sast-linter.php

  dast:
    name: DAST Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run DAST tests
        run: bash scripts/dast.sh

  benchmark:
    name: Performance Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run benchmark regression check
        run: php scripts/benchmark-ci.php
      - name: Upload benchmark baseline artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-baseline
          path: storage/benchmark/
