name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# ──────────────────────────────────────────────────────────────
# Quality & Security Gates — Ubuntu + PHP 8.4 only
#
# Cross-platform compatibility is tested in test.yml.
# This workflow runs expensive analysis once on the canonical
# environment (Ubuntu + PHP 8.4).
# ──────────────────────────────────────────────────────────────

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, json, mbstring, openssl, fileinfo
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist
      - name: Composer Audit
        run: composer audit --format=table || echo "::warning::Composer audit found vulnerabilities"
      - name: Generate SBOM
        run: php scripts/generate-sbom.php
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: storage/sbom/
      - name: Supply Chain Audit
        run: php scripts/audit-supply-chain.php
      - name: PHPStan (Level Max)
        run: php -d memory_limit=512M vendor/bin/phpstan analyse --level=max --no-progress --memory-limit=512M
      - name: Psalm Taint Analysis
        run: php -d memory_limit=512M vendor/bin/psalm --taint-analysis --no-progress --show-info=false --php-version=8.4 2>&1 || echo "::warning::Psalm taint analysis found issues"
      - name: PHPCS (shipped code, ratchet baseline 0)
        # v1.5.0 G1: shipped-code style gate. Baseline was 136 errors, ALL of
        # them lines >160 chars (Generic.Files.LineLength.MaxExceeded).
        # Wave 2 (assembly) rewrapped all 136 in the same PR and lowered the
        # baseline to 0: the gate now fails on ANY new violation. Warnings
        # (lines >120 chars) are not counted. phpcs exits 1 while errors
        # exist, so the JSON report is captured and the count compared
        # instead of relying on the exit code.
        run: |
          php vendor/bin/phpcs --standard=phpcs.xml --report=json --report-file=/tmp/phpcs-shipped.json \
            --runtime-set ignore_warnings_on_exit 1 \
            Auth Cache Commands DB Debug Lite Mail Middleware Observers Queue Testing Attributes Logger *.php || true
          ERRORS=$(php -r '$d=json_decode(file_get_contents("/tmp/phpcs-shipped.json"),true); echo (int)$d["totals"]["errors"];')
          echo "phpcs shipped-code errors: $ERRORS (baseline 0)"
          if [ "$ERRORS" -gt 0 ]; then echo "::error::phpcs shipped-code errors rose to $ERRORS (baseline 0) — fix new violations"; exit 1; fi

  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run fuzz tests
        run: php scripts/fuzz.php

  chaos:
    name: Chaos Engineering
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run chaos tests
        run: php scripts/chaos-test.php

  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: SAST Linter
        run: php scripts/sast-linter.php

  dast:
    name: DAST Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, sqlite3, json, mbstring, openssl, fileinfo, curl
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare env
        shell: bash
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.testing ]; then
              cp .env.testing .env
            elif [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "ERROR: No .env template found!"
              exit 1
            fi
          fi
      - name: Run DAST tests
        # DAST suite is in-process (router-level, no live server needed).
        # scripts/dast.sh is legacy and requires a public/ dir that only
        # exists in generated app skeletons, not in the framework checkout.
        run: php vendor/bin/phpunit --configuration=phpunit-ci.xml --testsuite=DAST --no-progress
